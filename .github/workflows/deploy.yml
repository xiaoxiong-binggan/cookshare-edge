name: Deploy to Aliyun ESA Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Build project
        run: npm run build
        env:
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}
      
      - name: Configure Aliyun CLI
        run: |
          # 安装阿里云CLI
          curl -O https://aliyuncli.alicdn.com/aliyun-cli-linux-latest-amd64.tgz
          tar -xzvf aliyun-cli-linux-latest-amd64.tgz
          sudo cp aliyun /usr/local/bin/
          
          # 配置认证
          aliyun configure set \
            --profile default \
            --access-key-id ${{ secrets.ALIYUN_ACCESS_KEY_ID }} \
            --access-key-secret ${{ secrets.ALIYUN_ACCESS_KEY_SECRET }} \
            --region cn-hangzhou
      
      - name: Deploy to ESA Pages
        run: |
          # 部署到ESA Pages
          aliyun esa deploy \
            --project-name cookshare-edge \
            --dist-dir ./dist \
            --esa-config ./esa.config.json
      
      - name: Trigger Deployment Hook
        if: success()
        run: |
          curl -X POST ${{ secrets.DEPLOY_HOOK_URL }}
      
      - name: Update deployment status
        uses: bobheadxi/deployments@v1
        with:
          step: finish
          token: ${{ github.token }}
          env: Production
          deployment_id: ${{ github.run_id }}
          status: ${{ job.status }}
